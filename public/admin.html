<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Challenge Admin</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">AI Challenge Game</p>
          <h1>Admin Control</h1>
        </div>
        <div class="admin-clock">
          <span id="admin-status">Ready</span>
          <strong id="admin-timer">05:00</strong>
        </div>
      </header>

      <section class="admin-grid">
        <form class="control-panel" id="challenge-form">
          <label for="prompt-input">Challenge prompt</label>
          <textarea id="prompt-input" rows="9" maxlength="2000"></textarea>

          <div class="field-row">
            <label for="duration-input">Duration seconds</label>
            <input id="duration-input" type="number" min="10" max="3600" step="5">
          </div>

          <div class="button-row">
            <button type="submit">Save Challenge</button>
            <button type="button" id="start-button" class="success">Start</button>
            <button type="button" id="pause-button">Pause</button>
            <button type="button" id="reset-button" class="danger">Reset</button>
          </div>
        </form>

        <section class="control-panel">
          <h2>Live Links</h2>
          <div class="link-list">
            <a id="display-link" href="/" target="_blank" rel="noreferrer">Combined Display</a>
            <a id="center-screen-link" href="/screen/center" target="_blank" rel="noreferrer">Center Screen</a>
            <a id="left-screen-link" href="/screen/left" target="_blank" rel="noreferrer">Left Screen</a>
            <a id="right-screen-link" href="/screen/right" target="_blank" rel="noreferrer">Right Screen</a>
            <a id="left-link" href="/contestant/left" target="_blank" rel="noreferrer">Contestant A</a>
            <a id="right-link" href="/contestant/right" target="_blank" rel="noreferrer">Contestant B</a>
          </div>

          <h2>Stream Status</h2>
          <dl class="status-list">
            <div>
              <dt>Contestant A</dt>
              <dd id="left-stream">Waiting</dd>
            </div>
            <div>
              <dt>Contestant B</dt>
              <dd id="right-stream">Waiting</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
