<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Challenge Center Screen</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="center-screen-body">
    <main class="center-screen" aria-label="Challenge prompt and timer">
      <section class="challenge-stage center-only">
        <div class="challenge-topline">
          <span id="round-status">Ready</span>
          <span id="connection-status">Connected</span>
        </div>
        <div class="timer" id="timer">05:00</div>
        <article class="prompt" id="prompt">
          Build a useful AI assistant for a live event host. You have five minutes. Show the clearest workflow you can.
        </article>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared.js"></script>
    <script src="/center.js"></script>
  </body>
</html>
